<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Manual de marca — acceso privado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap">
<style>
/* Numéricco Design System — tokens used by the login screen (tokens/colors, typography, spacing). */
@font-face{font-family:"PP Neue Montreal";src:url("login/fonts/PPNeueMontreal-Book.otf") format("opentype");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"PP Neue Montreal";src:url("login/fonts/PPNeueMontreal-Medium.otf") format("opentype");font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:"Space Mono";src:url("login/fonts/SpaceMono-Regular.ttf") format("truetype");font-weight:400;font-style:normal;font-display:swap}
:root{
  --n-warm-50:#F7F5F1;--n-warm-100:#F0EEE9;--n-warm-400:#C9BFB3;--n-warm-500:#B0A69B;--n-warm-600:#978E85;
  --n-warm-650:#8A8178;--n-warm-700:#6B6963;--n-warm-800:#5C5A54;--n-warm-950:#1C1C1C;
  --n-ink:#121212;--n-ink-soft:#1A1A1A;--n-danger-ink:#A32E22;--n-danger:#E89489;

  --bg-page:var(--n-warm-100);
  --bg-field:var(--n-warm-50);
  --bg-inverse:var(--n-ink);
  --text-primary:var(--n-ink-soft);
  --text-secondary:var(--n-warm-800);
  --text-quiet:var(--n-warm-700);
  --text-inverse:var(--n-warm-100);
  --text-danger:var(--n-danger-ink);
  --border-hairline:var(--n-warm-400);
  --border-ui:var(--n-warm-650);
  --border-strong:var(--n-ink);
  --bg-texture:url("login/bg-light-01.jpg");
  --logo:url("login/numericco-logo-positivo.png");

  --font-display:"PP Editorial New","Cormorant Garamond",Georgia,serif;
  --font-sans:"PP Neue Montreal",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  --font-mono:"Space Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --size-display-l:48px;--size-body:16px;--size-body-s:15px;--size-caption:13px;--size-mono-eyebrow:11px;
  --tracking-display:-0.020em;--tracking-sans:-0.022em;--tracking-mono:0.160em;--tracking-mono-wide:0.200em;

  --page-margin:36px;--space-3xs:4px;--space-2xs:8px;--space-xs:12px;--space-s:24px;--space-m:36px;--space-l:48px;
  --radius-button:5px;
  --duration-fast:160ms;--duration-base:280ms;--ease-brand:cubic-bezier(0.22,0.61,0.36,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg-page:var(--n-ink);--bg-field:var(--n-warm-950);--bg-inverse:var(--n-warm-100);
  --text-primary:var(--n-warm-100);--text-secondary:var(--n-warm-500);--text-quiet:var(--n-warm-600);
  --text-inverse:var(--n-ink);--text-danger:var(--n-danger);
  --border-hairline:rgba(201,191,179,0.45);--border-ui:var(--n-warm-600);--border-strong:var(--n-warm-100);
  --bg-texture:url("login/bg-dark-01.jpg");--logo:url("login/numericco-logo-negativo.png");
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg-page:var(--n-ink);--bg-field:var(--n-warm-950);--bg-inverse:var(--n-warm-100);
  --text-primary:var(--n-warm-100);--text-secondary:var(--n-warm-500);--text-quiet:var(--n-warm-600);
  --text-inverse:var(--n-ink);--text-danger:var(--n-danger);
  --border-hairline:rgba(201,191,179,0.45);--border-ui:var(--n-warm-600);--border-strong:var(--n-warm-100);
  --bg-texture:url("login/bg-dark-01.jpg");--logo:url("login/numericco-logo-negativo.png");
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100vh;min-height:100dvh;display:grid;grid-template-rows:auto 1fr auto;
  padding:var(--page-margin);gap:var(--space-l);
  background:var(--bg-page) var(--bg-texture) center/cover no-repeat fixed;
  color:var(--text-primary);font-family:var(--font-sans);font-size:var(--size-body);line-height:1.6;
  letter-spacing:var(--tracking-sans);-webkit-font-smoothing:antialiased;
}
.eyebrow{margin:0;font-family:var(--font-mono);font-size:var(--size-mono-eyebrow);line-height:1;letter-spacing:var(--tracking-mono);text-transform:uppercase;color:var(--text-quiet);white-space:nowrap}

.top{display:flex;align-items:center;justify-content:space-between;gap:var(--space-s)}
.logo{display:block;width:129px;height:24px;background:var(--logo) left center/contain no-repeat}

.gate{align-self:center;width:min(400px,100%);display:flex;flex-direction:column}
.gate .eyebrow{margin-bottom:var(--space-s)}
.gate h1{margin:0 0 var(--space-xs);font-family:var(--font-display);font-weight:300;font-size:var(--size-display-l);line-height:1;letter-spacing:var(--tracking-display)}
.gate h1 em{font-style:italic}
.lead{margin:0 0 var(--space-m);color:var(--text-secondary)}

label{display:block;margin-bottom:var(--space-2xs);font-size:var(--size-caption);font-weight:500;line-height:1.2}
input{
  display:block;width:100%;height:48px;padding:0 var(--space-xs);
  border:1px solid var(--border-ui);border-radius:var(--radius-button);background:var(--bg-field);
  color:var(--text-primary);font:400 var(--size-body)/1 var(--font-sans);letter-spacing:0;
  transition:border-color var(--duration-fast) var(--ease-brand);
}
input:hover{border-color:var(--border-strong)}
input:focus-visible{outline:1px solid var(--border-strong);outline-offset:2px;border-color:var(--border-strong)}
input[aria-invalid="true"]{border-color:var(--text-danger)}
input:disabled{opacity:.4}

button{
  margin-top:var(--space-s);height:48px;padding:0 var(--space-m);
  border:1px solid var(--bg-inverse);border-radius:var(--radius-button);background:var(--bg-inverse);color:var(--text-inverse);
  font:400 var(--size-body-s)/1.2 var(--font-sans);letter-spacing:var(--tracking-sans);cursor:pointer;
  transition:opacity var(--duration-fast) var(--ease-brand);
}
button:hover,button:active{opacity:.72}
button:focus-visible{outline:1px solid var(--border-strong);outline-offset:2px}
button:disabled{opacity:.4;cursor:progress}

.bar{height:1px;margin-top:var(--space-s);background:var(--border-hairline);visibility:hidden}
.bar i{display:block;height:100%;width:0;background:var(--border-strong);transition:width var(--duration-base) var(--ease-brand)}
.bar.is-on{visibility:visible}
.msg{min-height:1.6em;margin-top:var(--space-xs);font-size:var(--size-caption);color:var(--text-quiet)}
.msg.is-error{color:var(--text-danger)}

.foot{display:flex;justify-content:space-between;gap:var(--space-s);flex-wrap:wrap}

@media (max-width:600px){
  body{--page-margin:16px;padding:24px var(--page-margin)}
  .gate{align-self:start;padding-top:var(--space-l)}
  .gate h1{font-size:40px}
  .top .eyebrow,.foot .eyebrow:last-child{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <span class="logo" role="img" aria-label="Numéricco"></span>
  <p class="eyebrow">Acceso privado</p>
</header>
<form class="gate" id="gate" autocomplete="off">
  <p class="eyebrow">01. Manual de marca</p>
  <h1>Accede al <em>manual</em></h1>
  <p class="lead">Introduce la contraseña que te hemos facilitado para ver el manual de marca.</p>
  <label for="pw">Contraseña</label>
  <input id="pw" type="password" autocomplete="current-password" required autofocus aria-describedby="msg">
  <button id="go" type="submit">Entrar</button>
  <div class="bar" id="bar"><i></i></div>
  <div class="msg" id="msg" role="status" aria-live="polite"></div>
</form>
<footer class="foot">
  <p class="eyebrow">© Numéricco</p>
  <p class="eyebrow">Cifrado AES-256 · en tu navegador</p>
</footer>
<noscript><p style="text-align:center">Este manual necesita JavaScript para descifrarse.</p></noscript>
<script>
(() => {
  const VAULT = 'vault/';
  const SESSION_KEY = 'manual-vault-key';
  const IV_BYTES = 12;
  const form = document.getElementById('gate');
  const pw = document.getElementById('pw');
  const go = document.getElementById('go');
  const msg = document.getElementById('msg');
  const bar = document.getElementById('bar');

  const say = (text, isError) => {
    msg.textContent = text;
    msg.classList.toggle('is-error', !!isError);
    pw.setAttribute('aria-invalid', isError ? 'true' : 'false');
  };
  const b64ToBytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const bytesToB64 = b => btoa(String.fromCharCode(...b));
  const ssGet = k => { try { return sessionStorage.getItem(k); } catch (_) { return null; } };
  const ssSet = (k, v) => { try { sessionStorage.setItem(k, v); } catch (_) {} };
  const ssDel = k => { try { sessionStorage.removeItem(k); } catch (_) {} };

  if (!window.crypto || !crypto.subtle) {
    say('Abre el manual desde https:// o http://localhost: el navegador solo permite descifrar en un contexto seguro.', true);
    go.disabled = true;
    return;
  }

  const fetchBytes = async url => {
    const res = await fetch(url, { cache: 'no-cache' });
    if (!res.ok) throw new Error('No se pudo cargar ' + url + ' (' + res.status + ')');
    return new Uint8Array(await res.arrayBuffer());
  };
  const decrypt = async (key, bytes) =>
    new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes.subarray(0, IV_BYTES) }, key, bytes.subarray(IV_BYTES)));

  const deriveKey = async (password, config) => {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', hash: 'SHA-256', salt: b64ToBytes(config.salt), iterations: config.iterations },
      base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']
    );
  };

  const loadConfig = async () => {
    const res = await fetch(VAULT + 'config.json', { cache: 'no-cache' });
    if (!res.ok) throw new Error('No se encuentra vault/config.json');
    return res.json();
  };

  // Returns the manifest, or null when the key is wrong (AES-GCM auth fails).
  const openManifest = async key => {
    try {
      return JSON.parse(new TextDecoder().decode(await decrypt(key, await fetchBytes(VAULT + 'manifest.bin'))));
    } catch (e) {
      if (e && e.name === 'OperationError') return null;
      throw e;
    }
  };

  const decryptAll = async (key, files) => {
    const entries = Object.entries(files);
    const total = entries.reduce((n, [, f]) => n + f.size, 0) || 1;
    let done = 0;
    const out = {};
    bar.classList.add('is-on');
    let next = 0;
    const worker = async () => {
      while (next < entries.length) {
        const [path, f] = entries[next++];
        out[path] = { type: f.type, bytes: await decrypt(key, await fetchBytes(VAULT + 'f/' + f.id + '.bin')) };
        done += f.size;
        bar.firstElementChild.style.width = Math.round(done / total * 100) + '%';
        say('Descifrando… ' + Math.round(done / total * 100) + ' %');
      }
    };
    await Promise.all(Array.from({ length: 6 }, worker));
    return out;
  };

  const render = files => {
    const urls = {};
    const names = {};
    for (const [path, f] of Object.entries(files)) {
      if (!/^(assets|fonts)\//.test(path)) continue;
      const url = URL.createObjectURL(new Blob([f.bytes], { type: f.type }));
      urls[path] = url;
      names[url] = path.split('/').pop();
    }
    // Lets the manual's own download code name files after the original asset.
    window.__vaultName = url => names[url];

    const text = path => {
      if (!files[path]) throw new Error('Falta ' + path + ' en el archivo cifrado');
      return new TextDecoder().decode(files[path].bytes);
    };
    const rewrite = s => s.replace(/(?:assets|fonts)\/[^"'()\s?#]+(?:\?[^"'()\s#]*)?/g, m => urls[m.split('?')[0]] || m);

    const css = rewrite(text('decoyba-brand.css'));
    const js = text('decoyba-brand.js')
      .replace('const filenameFromUrl=url=>', 'const filenameFromUrl=url=>window.__vaultName?.(url)||')
      .replace("a.download=filename||''", 'a.download=filename||filenameFromUrl(url)')
      .replace("img.getAttribute('src').split('/').pop()", "filenameFromUrl(img.getAttribute('src'))");
    const doc = new DOMParser().parseFromString(rewrite(text('index.html')), 'text/html');

    doc.querySelectorAll('link[href^="decoyba-brand.css"], script[src^="decoyba-brand.js"]').forEach(n => n.remove());
    doc.querySelectorAll('a[download]').forEach(a => {
      const name = names[a.getAttribute('href')];
      if (name && !a.getAttribute('download')) a.setAttribute('download', name);
    });

    document.documentElement.lang = doc.documentElement.lang || 'es';
    document.title = doc.title;
    document.head.replaceChildren(...[...doc.head.childNodes].map(n => document.importNode(n, true)));
    const style = document.createElement('style');
    style.textContent = css;
    document.head.appendChild(style);
    document.body.replaceWith(document.importNode(doc.body, true));

    const script = document.createElement('script');
    script.src = URL.createObjectURL(new Blob([js], { type: 'text/javascript' }));
    script.onload = () => {
      const target = location.hash && document.getElementById(decodeURIComponent(location.hash.slice(1)));
      if (target) target.scrollIntoView();
    };
    document.body.appendChild(script);
  };

  const unlock = async key => {
    const manifest = await openManifest(key);
    if (!manifest) return false;
    go.disabled = true;
    pw.disabled = true;
    render(await decryptAll(key, manifest.files));
    return true;
  };

  form.addEventListener('submit', async e => {
    e.preventDefault();
    go.disabled = true;
    say('Comprobando…');
    try {
      const key = await deriveKey(pw.value, await loadConfig());
      const raw = new Uint8Array(await crypto.subtle.exportKey('raw', key));
      if (await unlock(key)) {
        ssSet(SESSION_KEY, bytesToB64(raw));
      } else {
        say('Contraseña incorrecta.', true);
        go.disabled = false;
        pw.select();
      }
    } catch (err) {
      say(err.message || 'No se pudo abrir el manual.', true);
      go.disabled = false;
      pw.disabled = false;
    }
  });

  // Same tab reload: reuse the key for this session instead of asking again.
  const saved = ssGet(SESSION_KEY);
  if (saved) {
    say('Abriendo…');
    crypto.subtle.importKey('raw', b64ToBytes(saved), 'AES-GCM', false, ['decrypt'])
      .then(unlock)
      .then(ok => { if (!ok) { ssDel(SESSION_KEY); say(''); } })
      .catch(() => { ssDel(SESSION_KEY); say(''); go.disabled = false; pw.disabled = false; });
  }
})();
</script>
</body>
</html>
